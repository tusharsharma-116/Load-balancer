<!DOCTYPE html>
<html>
<head>
  <title>Load Balancer Demo</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
      margin: 0;
      overflow-y: scroll;
    }
    #terminal {
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .cmd {
      color: #fff;
      font-weight: bold;
    }
    .info {
      color: #00ff00;
    }
    .error {
      color: #ff5555;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    const term = document.getElementById('terminal');
    
    function logCmd(cmd) {
      term.innerHTML += `\n<span class="cmd">user@host:~/load-balancer$ ${cmd}</span>\n`;
      scrollToBottom();
    }
    
    function logInfo(info) {
      term.innerHTML += `<span class="info">${info}</span>\n`;
      scrollToBottom();
    }
    
    function scrollToBottom() {
      window.scrollTo(0, document.body.scrollHeight);
    }

    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function fetchApi(url, options = {}) {
      try {
        const res = await fetch(url, options);
        const data = await res.json();
        return JSON.stringify(data, null, 2);
      } catch (err) {
        return err.toString();
      }
    }

    async function runDemo() {
      logInfo("=== Starting Enterprise Load Balancer Demo ===");
      await delay(2000);

      logCmd("curl -X GET http://localhost:3000/api/v1/health");
      await delay(1000);
      let res = await fetchApi('/api/v1/health');
      logInfo(res);
      await delay(3000);

      logCmd("curl -X GET http://localhost:3000/api/v1/health/nodes");
      await delay(1000);
      res = await fetchApi('/api/v1/health/nodes');
      logInfo(res);
      await delay(3000);

      for(let i = 1; i <= 3; i++) {
         logCmd(`curl -H "x-forwarded-for: 192.168.1.${i*10}" http://localhost:3000/api/v1/route/request`);
         await delay(1000);
         res = await fetchApi('/api/v1/route/request', {
            headers: { 'x-forwarded-for': `192.168.1.${i*10}` }
         });
         logInfo(res);
         await delay(2000);
      }

      logCmd('curl -X POST http://localhost:3000/api/v1/simulate/spike -d \'{"requests": 50}\'');
      await delay(1000);
      res = await fetchApi('/api/v1/simulate/spike', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({requests: 50})
      });
      logInfo(res);
      await delay(3000);

      logCmd("curl -X GET http://localhost:3000/api/v1/metrics");
      await delay(1000);
      res = await fetchApi('/api/v1/metrics');
      logInfo(res);
      await delay(3000);

      logInfo("\n=== Demo Complete! ===");
    }

    runDemo();
  </script>
</body>
</html>
